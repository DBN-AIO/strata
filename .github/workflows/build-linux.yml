name: Linux CPU-only build

# Configure, build and test the tree with NO CUDA (STRATA_ENABLE_CUDA=OFF): every CPU unit and parity test, plus
# strata-expert-server, the remote-experts server that runs on a host without a GPU (docs/REMOTE_EXPERTS.md, "CPU-only host").
# It runs on OUR self-hosted runners (label linux-fast), not on GitHub-hosted ones (the organisation's hosted minutes are
# refused for now).  Nothing is cached on D: - the runner's own work folder and ~/.cache/strata-ci on the runner's system disk.
#
# A runner for this repository is registered by hand (the existing t340-fast-* runners belong to DBN-AIO/AIO and cannot take
# jobs of this repository): docs/REMOTE_EXPERTS.md, "CI runner".

on:
  push:
    branches: [remote-experts, cpu-only-build]
    paths:
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'third_party/**'
      - 'tools/slice_gguf.py'
      - 'CMakeLists.txt'
      - '.github/workflows/build-linux.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'third_party/**'
      - 'tools/slice_gguf.py'
      - 'CMakeLists.txt'
      - '.github/workflows/build-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_VERSION: 3.31.6
  CMAKE_SHA256: 5a1133ff103c71eb5120e2cc3de922733e7d8a26a98ae716397e8676adb367bf
  CI_CACHE: ${{ github.workspace }}/../.strata-ci-cache   # beside the checkout, on the runner's disk (never D:)

jobs:
  cpu-only:
    # A self-hosted runner executes the code of the branch it builds.  A pull request from a fork would run the fork's version of
    # this file on our machine, so only pushes and same-repository pull requests take this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux-fast]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Disk and tools
        run: |
          set -eu
          mkdir -p "$CI_CACHE"
          avail_gb=$(df -BG --output=avail "$CI_CACHE" | tail -1 | tr -dc 0-9)
          echo "free on the runner's disk: ${avail_gb} GB"
          if [ "$avail_gb" -lt 8 ]; then echo "::error::less than 8 GB free for the build (needs ~2 GB, keeps 6 GB spare)"; exit 1; fi
          case "$CI_CACHE" in /mnt/d/*|/d/*|D:*) echo "::error::the CI cache must not sit on D:"; exit 1;; esac
          g++ --version | head -1
          # cmake >= 3.24 (the tree's minimum): the runner's own when it has one, else the pinned release, checked by hash
          if cmake --version 2>/dev/null | head -1 | awk '{split($3,v,"."); exit !(v[1]>3 || (v[1]==3 && v[2]>=24))}'; then
            echo "using $(command -v cmake)"
          else
            dir="$CI_CACHE/cmake-$CMAKE_VERSION-linux-x86_64"
            if [ ! -x "$dir/bin/cmake" ]; then
              curl -fsSL -o "$CI_CACHE/cmake.tgz" "https://github.com/Kitware/CMake/releases/download/v$CMAKE_VERSION/cmake-$CMAKE_VERSION-linux-x86_64.tar.gz"
              echo "$CMAKE_SHA256  $CI_CACHE/cmake.tgz" | sha256sum -c -
              tar -xzf "$CI_CACHE/cmake.tgz" -C "$CI_CACHE"
            fi
            echo "$dir/bin" >> "$GITHUB_PATH"
          fi

      - name: Configure (CUDA off)
        run: |
          set -eu
          cmake --version | head -1
          # FETCHCONTENT_BASE_DIR: the pinned llama.cpp (ggml-cpu) is cloned once per runner, not once per run
          cmake -S . -B build-cpu -DCMAKE_BUILD_TYPE=Release -DSTRATA_ENABLE_CUDA=OFF -DSTRATA_BUILD_TESTS=ON \
                -DFETCHCONTENT_BASE_DIR="$CI_CACHE/_deps" -Wno-dev
          # the CPU-only server must be part of this configuration, or the job would pass while building nothing of it
          cmake --build build-cpu --target help | grep -q 'strata-expert-server'

      - name: Build
        run: |
          # at most 8 threads, at low priority: the runner host also runs other services
          jobs=$(nproc); [ "$jobs" -gt 8 ] && jobs=8
          nice -n 5 cmake --build build-cpu -j"$jobs"

      - name: Test
        run: |
          jobs=$(nproc); [ "$jobs" -gt 4 ] && jobs=4
          # isa_guard_check: fails on GCC 15 for two unlisted iq_avx512.cpp functions (iq512_reference_gu_rows, iq512x_rows), in files
          # this job's change does not touch (docs/REMOTE_EXPERTS.md, "CI"); drop the exclusion once its allow-list is fixed
          ctest --test-dir build-cpu --output-on-failure -j"$jobs" --timeout 300 -E '^isa_guard_check$'

      - name: The server starts without a GPU
        run: |
          build-cpu/strata-expert-server --help | head -3
          if ldd build-cpu/strata-expert-server | grep -Ei 'libcuda|libcudart|libcublas|libnvrtc|libamdhip'; then
            echo "::error::strata-expert-server links a GPU runtime"; exit 1
          fi

  # DEFERRED: a Windows compile check of the same target (the server's socket shim has a Winsock branch, never compiled in CI).
  # There is no Windows runner for this repository yet; when one is registered, enable this job.
  #
  # windows-compile-check:
  #   if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
  #   runs-on: [self-hosted, windows]
  #   timeout-minutes: 30
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Configure and build (CPU only)
  #       shell: cmd
  #       run: |
  #         call "C:\Program Files\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
  #         cmake -S . -B build-cpu -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTRATA_ENABLE_CUDA=OFF -DSTRATA_BUILD_TESTS=ON
  #         cmake --build build-cpu --target strata-expert-server
  #   # cmake/cpu_expert_server.cmake builds the server on UNIX only today (it needs the Winsock link line and the mlock guard in
  #   # the main file checked first); lift that condition together with this job.
