name: Linux CPU-only build

# Configure, build and test the tree with NO CUDA (STRATA_ENABLE_CUDA=OFF): every CPU unit and parity test, plus
# strata-expert-server, the remote-experts server that runs on a host without a GPU (docs/REMOTE_EXPERTS.md, "CPU-only host").
# It runs on OUR self-hosted runners (label linux-fast), not on GitHub-hosted ones (the organisation's hosted minutes are
# refused for now).  Nothing is cached on D: - the runner's own work folder and ~/.cache/strata-ci on the runner's system disk.
#
# A runner for this repository is registered by hand (the existing host-b-fast-* runners belong to the private orchestrator repo and cannot take
# jobs of this repository): docs/REMOTE_EXPERTS.md, "CI runner".

on:
  push:
    branches: [remote-experts, cpu-only-build]
    paths:
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'third_party/**'
      - 'tools/slice_gguf.py'
      - 'tools/dsv41/**'
      - 'tests/dsv41/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-linux.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'third_party/**'
      - 'tools/slice_gguf.py'
      - 'tools/dsv41/**'
      - 'tests/dsv41/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_VERSION: 3.31.6
  CMAKE_SHA256: 5a1133ff103c71eb5120e2cc3de922733e7d8a26a98ae716397e8676adb367bf
  CI_CACHE: ${{ github.workspace }}/../.strata-ci-cache   # beside the checkout, on the runner's disk (never D:)
  # gcc, cmake's compiler probe and python's tempfile write their scratch files here, not to the runner's quota-limited tmpfs /tmp
  # ("error closing /tmp/cc*.s: Disk quota exceeded", runs on remote-experts 2026-11-04); the 'Disk and tools' step creates it
  TMPDIR: ${{ github.workspace }}/../.strata-ci-tmp

jobs:
  cpu-only:
    # A self-hosted runner executes the code of the branch it builds.  A pull request from a fork would run the fork's version of
    # this file on our machine, so only pushes and same-repository pull requests take this job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux-fast]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No home-lab specifics in added lines (public repository)
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          python3 tools/test_check_no_homelab.py
          python3 tools/check_no_homelab.py --base origin/main

      - name: Disk and tools
        run: |
          set -eu
          mkdir -p "$CI_CACHE"
          mkdir -p "$TMPDIR"
          avail_gb=$(df -BG --output=avail "$CI_CACHE" | tail -1 | tr -dc 0-9)
          echo "free on the runner's disk: ${avail_gb} GB"
          if [ "$avail_gb" -lt 8 ]; then echo "::error::less than 8 GB free for the build (needs ~2 GB, keeps 6 GB spare)"; exit 1; fi
          case "$CI_CACHE" in <mount>/*|/d/*|D:*) echo "::error::the CI cache must not sit on D:"; exit 1;; esac
          g++ --version | head -1
          # cmake >= 3.24 (the tree's minimum): the runner's own when it has one, else the pinned release, checked by hash
          if command -v cmake >/dev/null 2>&1 && cmake --version | head -1 | awk '{split($3,v,"."); exit !(v[1]>3 || (v[1]==3 && v[2]>=24))}'; then
            echo "using $(command -v cmake)"
          else
            dir="$CI_CACHE/cmake-$CMAKE_VERSION-linux-x86_64"
            if [ ! -x "$dir/bin/cmake" ]; then
              curl -fsSL -o "$CI_CACHE/cmake.tgz" "https://github.com/Kitware/CMake/releases/download/v$CMAKE_VERSION/cmake-$CMAKE_VERSION-linux-x86_64.tar.gz"
              echo "$CMAKE_SHA256  $CI_CACHE/cmake.tgz" | sha256sum -c -
              tar -xzf "$CI_CACHE/cmake.tgz" -C "$CI_CACHE"
            fi
            echo "$dir/bin" >> "$GITHUB_PATH"
          fi

      - name: Configure (CUDA off)
        run: |
          set -eu
          cmake --version | head -1
          # FETCHCONTENT_BASE_DIR: the pinned llama.cpp (ggml-cpu) is cloned once per runner, not once per run
          cmake -S . -B build-cpu -DCMAKE_BUILD_TYPE=Release -DSTRATA_ENABLE_CUDA=OFF -DSTRATA_BUILD_TESTS=ON \
                -DFETCHCONTENT_BASE_DIR="$CI_CACHE/_deps" -Wno-dev
          # the CPU-only server must be part of this configuration, or the job would pass while building nothing of it
          cmake --build build-cpu --target help | grep -q 'strata-expert-server'

      - name: Build
        run: |
          # at most 8 threads, at low priority: the runner host also runs other services
          jobs=$(nproc); [ "$jobs" -gt 8 ] && jobs=8
          nice -n 5 cmake --build build-cpu -j"$jobs"

      - name: Test
        run: |
          jobs=$(nproc); [ "$jobs" -gt 4 ] && jobs=4
          # isa_guard_check: fails on GCC 15 for two unlisted iq_avx512.cpp functions (iq512_reference_gu_rows, iq512x_rows), in files
          # this job's change does not touch (docs/REMOTE_EXPERTS.md, "CI"); drop the exclusion once its allow-list is fixed
          ctest --test-dir build-cpu --output-on-failure -j"$jobs" --timeout 300 -E '^isa_guard_check$'

      - name: The server starts without a GPU
        run: |
          build-cpu/strata-expert-server --help | head -3
          if ldd build-cpu/strata-expert-server | grep -Ei 'libcuda|libcudart|libcublas|libnvrtc|libamdhip'; then
            echo "::error::strata-expert-server links a GPU runtime"; exit 1
          fi
          build-cpu/strata-dsv41-expert-server --help | head -2
          if ldd build-cpu/strata-dsv41-expert-server | grep -Ei 'libcuda|libcudart|libcublas|libnvrtc|libamdhip'; then
            echo "::error::strata-dsv41-expert-server links a GPU runtime"; exit 1
          fi

      # DeepSeek-V4.1-Flash experts over the LAN (docs/DEEPSEEK41_SPLIT.md): a tiny DeepSeek-shaped model with random weights in the
      # real sets' quant types, 64 greedy tokens in one process vs. through expert servers on localhost, bit-identical expert rows;
      # also two servers, a server that dies mid-run (local fallback), and the refusals (engine family, token, geometry).  ~10 s.
      # Scratch packs go to a disk dir under the build tree (--tmp), never the runner's quota-limited tmpfs /tmp; servers are waited for by port.
      - name: DeepSeek split test (synthetic)
        run: python3 tools/dsv41/synthetic_split_test.py build-cpu --tmp build-cpu/synthetic-tmp

      # The wire protocol's socket cases (tools/net_experts_probe.py; docs/REMOTE_EXPERTS.md, "Security"): a wrong token, an oversized
      # pre-auth frame, bad requests that keep the session, a second conductor told busy, an idle connection, one address holding
      # the handshake slots, a request that starts and never finishes, a session that says nothing.  A real server on a synthetic
      # pack on loopback, a free port picked by the OS, killed by the PID this step started.  About 40 s (it waits out its timeouts).
      - name: Expert server socket probe (synthetic pack)
        run: |
          set -eu
          work=$(mktemp -d build-cpu/probe-XXXXXX)   # a disk dir under the build tree, never /tmp
          python3 tools/dsv41/make_synthetic_pack.py "$work/pack" --seed 1 > /dev/null
          port=$(python3 -c "import socket; s = socket.socket(); s.bind(('127.0.0.1', 0)); print(s.getsockname()[1])")
          export STRATA_EXPERT_TOKEN=ci-probe-token-123456 TMPDIR="$work"
          build-cpu/strata-dsv41-expert-server --pack "$work/pack" --listen "127.0.0.1:$port" --serve-layers 0-7 --no-warm --cpu-threads 2 \
              --expert-timeout-ms 3000 --expert-idle-timeout-ms 4000 > "$work/server.log" 2>&1 &
          srv=$!
          up=0
          for _ in $(seq 1 300); do
            kill -0 "$srv" 2>/dev/null || break
            if python3 -c "import socket,sys; socket.create_connection(('127.0.0.1', int(sys.argv[1])), 0.5).close()" "$port" 2>/dev/null; then up=1; break; fi
            sleep 0.1
          done
          rc=1
          if [ "$up" = 1 ]; then
            rc=0
            python3 tools/net_experts_probe.py --host 127.0.0.1 --port "$port" --pack "$work/pack" --timeout-ms 3000 --idle-ms 4000 > "$work/probe.out" 2>&1 || rc=$?
            cat "$work/probe.out"
            echo "PASS lines: $(grep -c '^PASS' "$work/probe.out" || true)"
          else
            echo "::error::the expert server did not start"
          fi
          kill "$srv" 2>/dev/null || true
          wait "$srv" 2>/dev/null || true
          echo "---- server log (tail)"; tail -n 25 "$work/server.log"
          if grep -q '^FAIL' "$work/probe.out" 2>/dev/null; then rc=1; fi
          exit "$rc"

      # BBXL: popularity-aware placement (plan_split.py --popularity) and the rank-ordered slice (slice_stream.py emit --perm); pure python, about 2 s.
      - name: DeepSeek split planner tests
        run: |
          python3 tools/dsv41/test_plan_split.py
          python3 tools/dsv41/test_slice_perm.py
          python3 tools/dsv41/test_bbxl_realweights_run.py build-cpu

  # DEFERRED: a Windows compile check of the same target (the server's socket shim has a Winsock branch, never compiled in CI).
  # There is no Windows runner for this repository yet; when one is registered, enable this job.
  #
  # windows-compile-check:
  #   if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
  #   runs-on: [self-hosted, windows]
  #   timeout-minutes: 30
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Configure and build (CPU only)
  #       shell: cmd
  #       run: |
  #         call "C:\Program Files\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
  #         cmake -S . -B build-cpu -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTRATA_ENABLE_CUDA=OFF -DSTRATA_BUILD_TESTS=ON
  #         cmake --build build-cpu --target strata-expert-server
  #   # cmake/cpu_expert_server.cmake builds the server on UNIX only today (it needs the Winsock link line and the mlock guard in
  #   # the main file checked first); lift that condition together with this job.
