name: Remote experts plan tool

on:
  pull_request:
    paths:
      - tools/remote_experts_plan.py
      - tests/remote/**
      - .github/workflows/remote-experts-plan.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/remote -p 'test_*.py' -v
